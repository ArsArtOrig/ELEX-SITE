<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1c">
<title>ELEX — платформа инди-игр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ БАЗА + ЗАЩИТА ОТ ВЫДЕЛЕНИЯ (в т.ч. смартфоны) ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;-webkit-touch-callout:default}
:root{
--bg0:#070510;--bg1:#0d0a1c;--surf:#151129;--surf2:#1c1636;
--line:rgba(139,123,255,.16);--line2:rgba(139,123,255,.34);
--text:#f2eeff;--muted:#a79fc4;--dim:#6f6790;
--violet:#7c3aff;--magenta:#ff2e7e;--cyan:#22d3ee;--lime:#a3ff3f;
--amber:#ffb020;--red:#ff4d5e;--green:#2fe6a7;--gold:#ffcf5c;
--grad:linear-gradient(135deg,#ff2e7e,#7c3aff);
--goldgrad:linear-gradient(135deg,#ffcf5c,#ff8a2a);
--nav-h:64px;
}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--text);font:400 15px/1.5 'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;touch-action:manipulation}
h1,h2,h3,.russo{font-family:'Russo One','Rubik',sans-serif;font-weight:400}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--cyan);text-decoration:none}
img{pointer-events:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--violet),var(--magenta));border-radius:8px;border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--cyan),var(--violet))}
*{scrollbar-width:thin;scrollbar-color:var(--violet) var(--bg1)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}

/* ============ ФОН ============ */
.aurora{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;mix-blend-mode:screen}
.a1{width:62vmax;height:62vmax;top:-24%;left:-14%;background:radial-gradient(circle,#ff2e7e55,transparent 65%);animation:drift1 28s ease-in-out infinite alternate}
.a2{width:70vmax;height:70vmax;bottom:-34%;right:-18%;background:radial-gradient(circle,#7c3aff4d,transparent 65%);animation:drift2 34s ease-in-out infinite alternate}
.a3{width:44vmax;height:44vmax;top:26%;left:52%;background:radial-gradient(circle,#22d3ee38,transparent 65%);animation:drift1 24s 4s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(9vw,7vh) scale(1.18)}}
@keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8vw,-6vh) scale(.92)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>")}
#fx{position:fixed;inset:0;z-index:500;pointer-events:none}

/* ============ КАРКАС ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:40;background:rgba(13,10,28,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);animation:navIn .5s both}
@keyframes navIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.topbar-in{max-width:1200px;margin:0 auto;height:100%;display:flex;align-items:center;gap:10px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 4px 18px -4px #ff2e7e88}
.brand-name{font-family:'Russo One';font-size:18px;letter-spacing:1.5px;color:#fff}
.brand-name span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-tabs{display:flex;gap:4px;margin-left:16px}
.tab{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;position:relative;transition:.18s}
.tab:hover{color:#fff;background:rgba(124,58,255,.12)}
.tab.active{color:#fff;background:rgba(124,58,255,.16);border-bottom-color:var(--magenta);text-shadow:0 0 14px #ff2e7e88}
.tab-crown{color:var(--gold)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;position:relative;background:var(--surf);border:1px solid var(--line);color:var(--muted);transition:.18s;flex-shrink:0}
.icon-btn:hover{color:#fff;border-color:var(--line2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.muted-state{color:var(--red);border-color:rgba(255,77,94,.35)}
.badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--grad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg1)}
.badge.gold{background:var(--goldgrad);color:#241300}
.crown-bell{color:var(--gold);border-color:rgba(255,207,92,.4);background:rgba(255,207,92,.09)}
.crown-bell:hover{box-shadow:0 0 18px -2px #ffcf5c77;color:var(--gold)}
.cb-crown{position:absolute;top:1px;left:50%;transform:translateX(-50%);color:var(--gold);line-height:0}
.crown-bell.has-badge::after{content:'';position:absolute;inset:-4px;border-radius:14px;border:2px solid #ffcf5c66;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.9)}70%{opacity:0;transform:scale(1.25)}100%{opacity:0}}
.bal-pill{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surf);border:1px solid rgba(255,207,92,.32);color:var(--gold);font-weight:700;font-size:14px;transition:.18s;flex-shrink:0}
.bal-pill:hover{box-shadow:0 0 16px -4px #ffcf5c66;transform:translateY(-1px)}
.bal-pill .inf{font-size:19px;line-height:1;background:linear-gradient(90deg,#ffcf5c,#ff8a2a,#ffcf5c);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradMove 3s linear infinite}
.bal-pill.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:'Russo One';font-size:15px;color:#fff;border:2px solid rgba(255,255,255,.22);position:relative;flex-shrink:0;transition:.18s}
.avatar:hover{transform:translateY(-1px);box-shadow:0 0 14px -2px #7c3aff99}
.av-crown{position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--goldgrad);display:grid;place-items:center;color:#241300;border:2px solid var(--bg1)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.main{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:calc(var(--nav-h) + 22px) 20px 50px}
.tabbar{display:none}
.foot{margin:44px 0 10px;text-align:center;color:var(--dim);font-size:12px;display:flex;flex-direction:column;gap:5px;align-items:center}
.foot .ic{color:var(--violet)}

/* ============ КНОПКИ / ЧИПЫ / СТАТУСЫ ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px -8px #ff2e7e99}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn-gold{background:var(--goldgrad);color:#241300;box-shadow:0 8px 24px -8px #ffcf5c88}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#2fe6a7,#0fbf8f);color:#06251b;box-shadow:0 6px 20px -8px #2fe6a788}
.btn-success:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surf);border-color:var(--line2);color:var(--text)}
.btn-ghost:hover{border-color:var(--violet);background:rgba(124,58,255,.14)}
.btn-danger{background:linear-gradient(135deg,#ff4d5e,#e11d48);color:#fff}
.btn-danger-ghost{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.4);color:var(--red)}
.btn-danger-ghost:hover{background:rgba(255,77,94,.18)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surf);border:1px solid var(--line);color:var(--muted);transition:.16s;white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--line2)}
.chip.active{background:rgba(124,58,255,.22);border-color:var(--violet);color:#fff;box-shadow:0 0 14px -4px #7c3aff88}
.tag{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);color:var(--cyan)}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.status .sd{width:7px;height:7px;border-radius:50%;background:currentColor}
.status.pending{background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.45);color:var(--amber)}
.status.pending .sd{animation:pulse 1.4s infinite}
.status.published{background:rgba(47,230,167,.1);border:1px solid rgba(47,230,167,.4);color:var(--green)}
.status.rejected{background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.4);color:var(--red)}
.grad-text{background:linear-gradient(90deg,#ff2e7e,#7c3aff,#22d3ee,#ff2e7e);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradMove 8s linear infinite}
@keyframes gradMove{to{background-position:300% 0}}

/* ============ ВХОД ============ */
.auth-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center;max-width:1060px;margin:0 auto;min-height:calc(100vh - 160px);min-height:calc(100dvh - 160px);padding:20px 0}
.brand-xl{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.brand-xl .brand-mark{width:46px;height:46px;border-radius:14px}
.brand-xl .brand-name{font-size:27px}
.auth-hero h1{font-size:clamp(30px,4.4vw,46px);line-height:1.14;margin-bottom:14px}
.auth-hero p{color:var(--muted);max-width:460px;margin-bottom:22px}
.auth-feats{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.auth-feats li{display:flex;align-items:center;gap:11px;font-size:14px;color:var(--text)}
.auth-feats .fi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.fi.gold{background:rgba(255,207,92,.12);color:var(--gold);border:1px solid rgba(255,207,92,.3)}
.fi.cyan{background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.fi.lime{background:rgba(163,255,63,.1);color:var(--lime);border:1px solid rgba(163,255,63,.3)}
.fi.violet{background:rgba(124,58,255,.14);color:#b79aff;border:1px solid rgba(124,58,255,.4)}
.auth-card{background:rgba(21,17,41,.94);border:1px solid var(--line2);border-radius:24px;padding:26px;box-shadow:0 30px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.05);width:100%;max-width:440px;justify-self:end}
.auth-card.shake{animation:shake .45s}
.seg{display:flex;background:var(--bg1);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg-btn{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);transition:.16s}
.seg-btn.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px -4px #ff2e7e88}
.auth-tabs{margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.input,.textarea,select.input{width:100%;background:var(--bg1);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;color:var(--text);font:400 16px/1.4 'Rubik',sans-serif;transition:.16s;outline:none}
.input:focus,.textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,255,.22)}
.input.invalid,.textarea.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,77,94,.18)}
.textarea{resize:vertical;min-height:90px}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:46px}
.pass-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--dim);border-radius:9px}
.pass-eye:hover{color:var(--cyan)}
.err{color:var(--red);font-size:13px;min-height:19px;margin:2px 0 8px}
.auth-bonus{margin-top:14px;text-align:center;font-size:13px;color:var(--lime);background:rgba(163,255,63,.07);border:1px solid rgba(163,255,63,.25);border-radius:11px;padding:9px 12px}
.auth-mini{margin-top:16px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.4px}

/* ============ HERO КАТАЛОГА ============ */
.hero{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:center;padding:26px 0 8px;position:relative;background:radial-gradient(at 15% 20%,rgba(124,58,255,.16),transparent 50%),radial-gradient(at 85% 25%,rgba(255,46,126,.12),transparent 50%),radial-gradient(at 55% 95%,rgba(34,211,238,.1),transparent 55%);border-radius:26px}
.hero.solo{grid-template-columns:1fr}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;background:rgba(163,255,63,.08);border:1px solid rgba(163,255,63,.3);color:var(--lime)}
.hero h1{font-size:clamp(30px,4.8vw,50px);line-height:1.12;margin:16px 0 12px}
.hero-sub{color:var(--muted);max-width:520px;font-size:15px}
.hero-btns{display:flex;gap:12px;margin:22px 0;flex-wrap:wrap}
.hero-stats{display:flex;gap:30px;flex-wrap:wrap}
.hs-num{font-family:'Russo One';font-size:23px}
.hs:nth-child(1) .hs-num{color:var(--cyan)}.hs:nth-child(2) .hs-num{color:#b79aff}.hs:nth-child(3) .hs-num{color:var(--lime)}
.hs-lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.hero-right{position:relative;height:300px}
.float-card{position:absolute;width:150px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 22px 50px -18px #000;cursor:pointer;transition:.2s;animation:floaty 6s ease-in-out infinite alternate}
.float-card:hover{transform:scale(1.06)!important;z-index:5}
.float-card .fc-cover{aspect-ratio:16/11;display:grid;place-items:center;font-size:44px}
.float-card .fc-title{padding:8px 10px;font-size:12px;font-weight:600;background:rgba(13,10,28,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc1{top:8px;left:10px;transform:rotate(-7deg);animation-delay:.2s}
.fc2{top:60px;left:150px;transform:rotate(5deg);animation-delay:1.1s;z-index:2}
.fc3{top:150px;left:52px;transform:rotate(-3deg);animation-delay:2s}
@keyframes floaty{from{translate:0 0}to{translate:0 -12px}}

/* ============ ПАНЕЛЬ КАТАЛОГА ============ */
.controls{position:sticky;top:var(--nav-h);z-index:30;background:rgba(13,10,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 0;border-bottom:1px solid var(--line);margin-top:14px}
.controls-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:0 12px;transition:.16s;color:var(--dim)}
.search-box:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,255,.2);color:var(--cyan)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font:400 16px 'Rubik';padding:11px 0;min-width:0}
.search-box input::placeholder{color:var(--dim)}
.search-clear{color:var(--dim);width:26px;height:26px;display:grid;place-items:center;border-radius:7px}
.search-clear:hover{color:var(--red)}
.select-wrap{position:relative}
.select-wrap select{appearance:none;-webkit-appearance:none;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:11px 36px 11px 13px;color:var(--text);font:600 13px 'Rubik';cursor:pointer;outline:none}
.select-wrap select:focus{border-color:var(--violet)}
.select-wrap .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim)}
.toggle-free.active{background:rgba(163,255,63,.12);border-color:rgba(163,255,63,.5);color:var(--lime)}
.genre-row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.views-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.views-lbl{font-size:12px;color:var(--dim);font-weight:600}
.view-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cyan);transition:.15s}
.view-chip:hover{background:rgba(34,211,238,.16)}
.view-chip.active{background:rgba(34,211,238,.22);box-shadow:0 0 12px -4px #22d3ee88}
.view-x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.view-x:hover{color:var(--red);background:rgba(255,77,94,.15)}
.grid-head{display:flex;align-items:center;gap:11px;margin:20px 0 14px;scroll-margin-top:calc(var(--nav-h) + 140px)}
.section-title{font-size:21px}
.count-pill{font-size:12px;font-weight:700;background:rgba(124,58,255,.18);border:1px solid rgba(124,58,255,.45);color:#c9b3ff;padding:3px 11px;border-radius:999px}

/* ============ КАРТОЧКИ ============ */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.game-card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative}
.game-card:hover{transform:translateY(-4px);border-color:rgba(124,58,255,.55);box-shadow:0 16px 44px -14px #7c3aff66}
.cover{aspect-ratio:16/10;display:grid;place-items:center;position:relative;overflow:hidden}
.cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 12px)}
.cover-shine{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%)}
.cover-emoji{font-size:56px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));transition:transform .25s;position:relative;z-index:1}
.game-card:hover .cover-emoji{transform:scale(1.14) rotate(-7deg)}
.price-badge{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(5,3,12,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:var(--gold);z-index:2}
.price-badge.free{color:var(--lime);border-color:rgba(163,255,63,.45)}
.new-badge{position:absolute;top:10px;left:10px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1px;background:var(--lime);color:#0c1a04;z-index:2;box-shadow:0 0 14px -2px #a3ff3fcc}
.card-body{padding:13px 14px 14px}
.card-title{font-family:'Rubik';font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card-author{display:inline-flex;align-items:center;gap:5px}
.card-foot{display:flex;align-items:center;gap:12px;margin-top:11px;font-size:12px}
.dl-count{display:inline-flex;align-items:center;gap:5px;color:var(--cyan);font-weight:600}
.like-mini{display:inline-flex;align-items:center;gap:4px;color:#ff8ae2}
.card-cta{margin-left:auto;color:#b79aff;font-weight:700;font-size:12px;transition:.18s}
.game-card:hover .card-cta{color:var(--magenta);transform:translateX(3px)}

/* ============ ПУСТЫЕ СОСТОЯНИЯ ============ */
.empty{padding:52px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;grid-column:1/-1}
.empty-emoji{font-size:54px;animation:floaty 3.5s ease-in-out infinite alternate}
.empty-title{font-size:17px;font-weight:700}
.empty-sub{font-size:13px;color:var(--muted);max-width:380px}
.empty .btn{margin-top:10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:640px;margin:18px 0 6px}
.step{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.step b{font-size:13px}
.step p{font-size:12px;color:var(--muted);line-height:1.45}
.step-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.step-ic.v{background:rgba(124,58,255,.16);color:#b79aff;border:1px solid rgba(124,58,255,.4)}
.step-ic.a{background:rgba(255,176,32,.1);color:var(--amber);border:1px solid rgba(255,176,32,.35)}
.step-ic.g{background:rgba(47,230,167,.1);color:var(--green);border:1px solid rgba(47,230,167,.35)}

/* ============ ОВЕРЛЕИ ============ */
#overlay-root{position:relative;z-index:100}
.scrim{position:fixed;inset:0;background:rgba(5,3,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .22s both;z-index:100}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg1);border-left:1px solid var(--line2);z-index:101;display:flex;flex-direction:column;animation:slideIn .28s cubic-bezier(.2,.9,.3,1) both;box-shadow:-30px 0 80px -20px #000}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideOut{to{transform:translateX(100%)}}
.drawer-cover{height:190px;position:relative;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.drawer-cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 13px)}
.dc-emoji{font-size:84px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));position:relative;animation:floaty 4s ease-in-out infinite alternate}
.drawer-close{position:absolute;top:12px;right:12px;background:rgba(5,3,12,.6);border-color:rgba(255,255,255,.2);color:#fff;z-index:3}
.dc-badges{position:absolute;top:12px;left:12px;display:flex;gap:7px;z-index:2;flex-wrap:wrap}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px 26px}
.drawer-title-row{display:flex;align-items:flex-start;gap:12px}
.drawer-title-row h2{font-size:24px;line-height:1.2;flex:1;overflow-wrap:anywhere}
.heart-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surf);border:1px solid var(--line2);color:var(--muted);transition:.16s;flex-shrink:0}
.heart-btn:hover{border-color:#ff8ae2;color:#ff8ae2}
.heart-btn.liked{background:rgba(255,46,126,.14);border-color:var(--magenta);color:var(--magenta)}
.heart-btn.liked .ic{fill:currentColor}
.drawer-meta{display:flex;align-items:center;gap:10px;margin:10px 0 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.author-chip{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--text)}
.mini-av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-family:'Russo One'}
.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:13px;margin-bottom:14px;line-height:1.45}
.banner.pending{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.35);color:var(--amber)}
.banner.rejected{background:rgba(255,77,94,.09);border:1px solid rgba(255,77,94,.35);color:var(--red)}
.banner.published{background:rgba(47,230,167,.08);border:1px solid rgba(47,230,167,.3);color:var(--green)}
.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat-box{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;min-width:0}
.stat-num{font-family:'Russo One';font-size:21px;display:block}
.stat-num.c-cyan{color:var(--cyan)}.stat-num.c-pink{color:#ff8ae2}.stat-num.c-lime{color:var(--lime)}.stat-num.c-gold{color:var(--gold)}
.stat-num.pop{animation:popNum .45s}
@keyframes popNum{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.stat-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.drawer-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.link-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:16px;transition:.16s;color:var(--cyan)}
.link-row:hover{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06)}
.link-row b{display:block;font-size:13px;color:var(--text)}
.link-url{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.link-row .go{margin-left:auto;flex-shrink:0}
.action-row{display:grid;gap:10px}
.action-sub{display:flex;gap:8px;flex-wrap:wrap}
.action-sub .btn{flex:1}
.drawer-note{font-size:11px;color:var(--dim);text-align:center;margin-top:10px}
.buy-note{font-size:12px;color:var(--muted);text-align:center}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 28px));max-height:88vh;max-height:88dvh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line2);border-radius:22px;z-index:101;animation:popIn .24s cubic-bezier(.2,.9,.3,1.2) both;box-shadow:0 40px 100px -30px #000}
.modal-lg{width:min(780px,calc(100% - 28px))}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-48%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popOut{to{opacity:0;transform:translate(-50%,-48%) scale(.95)}}
#overlay-root.closing .scrim{animation:fadeOut .19s both}
#overlay-root.closing .drawer{animation:slideOut .19s both}
#overlay-root.closing .modal{animation:popOut .19s both}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg1);z-index:2}
.modal-head h2{font-size:19px;flex:1;display:flex;align-items:center;gap:10px}
.modal-head .ic{color:var(--magenta)}
.modal-body{padding:20px 22px 22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.pub-layout{display:grid;grid-template-columns:1fr 252px;gap:22px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-hint{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.45}
.char-count{font-size:11px;color:var(--dim);text-align:right;margin-top:4px}
.price-wrap{margin-top:9px;position:relative}
.price-wrap .cur{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--gold);font-weight:700;font-size:13px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-opt{aspect-ratio:1;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:19px;display:grid;place-items:center;transition:.14s}
.emoji-opt:hover{border-color:var(--line2);transform:scale(1.1)}
.emoji-opt.active{border-color:var(--magenta);background:rgba(255,46,126,.15);box-shadow:0 0 12px -3px #ff2e7e99}
.theme-row{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.theme-sw{width:27px;height:27px;border-radius:50%;border:2px solid transparent;transition:.14s}
.theme-sw:hover{transform:scale(1.15)}
.theme-sw.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 14px -2px currentColor}
.pub-preview{position:sticky;top:0;align-self:start}
.pp-label{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.pp-note{font-size:11px;color:var(--dim);margin-top:11px;line-height:1.5;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.pub-preview .game-card{pointer-events:none}
.rules-note{font-size:11px;color:var(--amber);background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.25);border-radius:10px;padding:9px 11px;margin-top:12px;line-height:1.5}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quick-chip{padding:9px 14px;border-radius:11px;background:rgba(255,207,92,.09);border:1px solid rgba(255,207,92,.35);color:var(--gold);font-weight:700;font-size:13px;transition:.15s}
.quick-chip:hover{background:rgba(255,207,92,.2);transform:translateY(-1px)}
.topup-bal{font-size:13px;color:var(--muted);margin-bottom:14px}
.topup-bal b{color:var(--gold);font-size:17px;font-family:'Russo One'}
.inf-btn{width:100%;margin-top:6px;padding:13px;border-radius:13px;font-weight:800;font-size:15px;letter-spacing:.5px;background:linear-gradient(90deg,#ffcf5c,#ff8a2a,#ff2e7e,#ffcf5c);background-size:300% 100%;color:#241300;animation:gradMove 5s linear infinite;transition:.15s}
.inf-btn:hover{filter:brightness(1.1)}
.inf-btn.off{background:var(--surf);color:var(--muted);border:1px solid var(--line2);animation:none}

/* ============ ПРОВЕРКА ============ */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head>div{flex:1;min-width:220px}
.page-title{font-size:25px;display:flex;align-items:center;gap:11px}
.page-title .ic{color:var(--magenta)}
.page-title .gold-ic{color:var(--gold)}
.page-sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:560px}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.sc{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;background:currentColor;opacity:.08;filter:blur(10px)}
.sc-num{font-family:'Russo One';font-size:24px}
.sc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.sc.amber{color:var(--amber)}.sc.green{color:var(--green)}.sc.cyan{color:var(--cyan)}.sc.violet{color:#b79aff}
.sc .sc-num{color:currentColor}.sc .sc-lbl{color:var(--muted)}
.mod-layout{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.queue-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.check-all{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.check-all input,.q-check{width:17px;height:17px;accent-color:var(--magenta);cursor:pointer}
.q-item{display:grid;grid-template-columns:auto auto 1fr auto;gap:13px;padding:15px;background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;align-items:start;transition:.16s}
.q-item.selected{border-color:var(--magenta);background:rgba(255,46,126,.05)}
.q-cover{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:27px;flex-shrink:0;position:relative;overflow:hidden}
.q-cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 10px)}
.q-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.q-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:5px 0 7px;flex-wrap:wrap}
.q-meta span{display:inline-flex;align-items:center;gap:5px}
.q-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:9px}
.link-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);color:var(--cyan);transition:.15s}
.link-chip:hover{background:rgba(34,211,238,.18)}
.q-actions{display:flex;flex-direction:column;gap:7px}
.reason-box{margin-top:11px;background:rgba(255,77,94,.06);border:1px solid rgba(255,77,94,.3);border-radius:12px;padding:11px}
.reason-box .textarea{min-height:60px;font-size:14px;margin-bottom:9px}
.reason-btns{display:flex;gap:8px}
.bulk-bar{position:sticky;bottom:14px;display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:15px;background:rgba(28,22,54,.96);border:1px solid var(--violet);box-shadow:0 14px 40px -10px #7c3aff77;margin-top:12px;flex-wrap:wrap;z-index:5}
.bulk-count{font-weight:700;font-size:14px;color:#c9b3ff;margin-right:auto}
.feed-col h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.feed-col h3 .ic{color:var(--gold)}
.feed-item{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.feed-ic.submission{background:rgba(255,176,32,.12);color:var(--amber)}
.feed-ic.publish{background:rgba(47,230,167,.12);color:var(--green)}
.feed-ic.reject{background:rgba(255,77,94,.12);color:var(--red)}
.feed-ic.buy,.feed-ic.topup{background:rgba(255,207,92,.12);color:var(--gold)}
.feed-ic.user{background:rgba(34,211,238,.12);color:var(--cyan)}
.feed-ic.system{background:rgba(124,58,255,.16);color:#b79aff}
.feed-txt{font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.feed-time{font-size:11px;color:var(--dim);margin-top:2px}

/* ============ МОИ ИГРЫ ============ */
.my-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:13px;padding:13px 15px;background:var(--surf);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;align-items:center;transition:border-color .15s,opacity .15s}
.my-row:hover{border-color:var(--line2)}
.my-row.dragging{opacity:.35}
.my-row.drop-before{border-top:2px solid var(--magenta)}
.my-row.drop-after{border-bottom:2px solid var(--magenta)}
.drag-handle{color:var(--dim);cursor:grab;display:grid;place-items:center;padding:4px}
.drag-handle:active{cursor:grabbing}
.my-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.my-meta{display:flex;align-items:center;gap:11px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.my-meta span{display:inline-flex;align-items:center;gap:5px}
.reject-note{font-size:12px;color:var(--red);background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.25);border-radius:9px;padding:6px 10px;margin-top:8px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ============ ПРОФИЛЬ ============ */
.profile-head{display:flex;align-items:center;gap:19px;margin-bottom:24px;flex-wrap:wrap}
.avatar-xl{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:'Russo One';font-size:34px;color:#fff;border:3px solid rgba(255,255,255,.2);position:relative;box-shadow:0 12px 34px -10px #7c3aff88;flex-shrink:0}
.avatar-xl .av-crown{width:26px;height:26px;top:-5px;right:-5px}
.profile-head h1{font-size:27px;overflow-wrap:anywhere}
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;font-size:12px;font-weight:700;margin-top:7px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);color:var(--cyan)}
.role-badge.gold{background:var(--goldgrad);color:#241300;border:none;box-shadow:0 4px 16px -4px #ffcf5c88}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.balance-card{background:linear-gradient(135deg,#1c1636,#241a3f);border:1px solid rgba(255,207,92,.28);border-radius:20px;padding:22px;position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#ffcf5c22,transparent 70%)}
.bc-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.bc-label .ic{color:var(--gold)}
.bc-num{font-family:'Russo One';font-size:40px;color:var(--gold);margin:8px 0 14px;line-height:1}
.bc-num small{font-size:17px;color:var(--muted)}
.bc-num .inf{font-size:52px;background:linear-gradient(90deg,#ffcf5c,#ff8a2a,#ff2e7e,#ffcf5c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradMove 4s linear infinite}
.bc-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mini-stat{background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:15px}
.mini-stat .sc-num{font-size:21px}
.profile-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.profile-cols h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.profile-cols h3 .ic{color:var(--cyan)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:13px;transition:.15s;border:1px solid transparent}
.list-row:hover{background:var(--surf);border-color:var(--line)}
.list-row .q-cover{width:42px;height:42px;font-size:20px;border-radius:11px}
.lr-main{flex:1;min-width:0}
.lr-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-sub{font-size:11px;color:var(--dim);margin-top:2px}

/* ============ ТОСТЫ ============ */
#toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 24px))}
.toast{display:flex;align-items:center;gap:11px;background:rgba(28,22,54,.97);border:1px solid var(--line2);border-left:3px solid var(--cyan);border-radius:14px;padding:13px 14px;box-shadow:0 18px 50px -12px #000;position:relative;overflow:hidden;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast.out{animation:toastOut .2s both}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
.toast-msg{font-size:13px;font-weight:500;flex:1;line-height:1.4;overflow-wrap:anywhere}
.toast-ic{flex-shrink:0;display:grid;place-items:center}
.toast.success{border-left-color:var(--green)}.toast.success .toast-ic{color:var(--green)}
.toast.error{border-left-color:var(--red)}.toast.error .toast-ic{color:var(--red)}
.toast.warn{border-left-color:var(--amber)}.toast.warn .toast-ic{color:var(--amber)}
.toast.gold{border-left-color:var(--gold);background:linear-gradient(135deg,rgba(40,28,10,.97),rgba(28,22,54,.97))}.toast.gold .toast-ic{color:var(--gold)}
.toast.info .toast-ic{color:var(--cyan)}
.toast-action{padding:7px 12px;border-radius:9px;background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.4);color:var(--cyan);font-weight:700;font-size:12px;flex-shrink:0}
.toast-action:hover{background:rgba(34,211,238,.26)}
.toast-x{color:var(--dim);width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;border-radius:7px}
.toast-x:hover{color:#fff}

function tone(f,dur,type,vol,delay=0,slideTo){if(muted)return;const ac=audio();if(!ac)return;try{const t=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03)}catch(e){}}

if(RM)drawDust(0,true)}
function drawDust(t,staticOnly){for(const d of dust){if(!staticOnly){d.x+=d.vx;d.y+=d.vy;if(d.y<-6){d.y=innerHeight+6;d.x=Math.random()*innerWidth}if(d.x<-6)d.x=innerWidth+6;if(d.x>innerWidth+6)d.x=-6}
const a=d.a*(staticOnly?1:(.65+.35*Math.sin(t/1000*d.tw)));fctx.globalAlpha=a;fctx.fillStyle=`hsl(${d.h} 90% 70%)`;fctx.beginPath();fctx.arc(d.x,d.y,d.r,0,7);fctx.fill()}fctx.globalAlpha=1}
function burst(x,y,colors,n=26){if(RM)n=Math.min(n,8);for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,sp=2+Math.random()*5;
bursts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-2.5,rot:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:3+Math.random()*5,h:2+Math.random()*4,c:colors[i%colors.length],life:1,dec:.011+Math.random()*.012})}}
function fxLoop(t){if(!document.hidden){fctx.clearRect(0,0,innerWidth,innerHeight);if(!RM)drawDust(t,false);
for(let i=bursts.length-1;i>=0;i--){const p=bursts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.vx*=.985;p.rot+=p.vr;p.life-=p.dec;
if(p.life<=0){bursts.splice(i,1);continue}
fctx.save();fctx.globalAlpha=Math.max(0,p.life);fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fctx.restore()}}
requestAnimationFrame(fxLoop)}

function toast(msg,type='info',opts={}){

const dur=opts.dur||(opts.action?8000:4500);
el.innerHTML=`<span class="toast-ic">${I(icn,18)}</span><span class="toast-msg"></span>${opts.action?`<button type="button" class="toast-action">${esc(opts.action.label)}</button>`:''}<button type="button" class="toast-x">${I('x',14)}</button><span class="toast-bar" style="--t:${dur}ms;color:inherit"></span>`;
el.querySelector('.toast-msg').textContent=msg;
const dismiss=()=>{if(!el.isConnected)return;el.classList.add('out');setTimeout(()=>el.remove(),200)};

if(opts.action)el.querySelector('.toast-action').onclick=()=>{opts.action.fn();dismiss()};

box.appendChild(el)}

function coverStyle(g){const t=THEMES[g.theme%THEMES.length];return`background:linear-gradient(135deg,${t[0]},${t[1]})`}
function avStyle(u){return`background:linear-gradient(135deg,hsl(${u.hue} 85% 55%),hsl(${(u.hue+50)%360} 85% 45%))`}
function statusChip(g){const m={pending:['pending','На проверке'],published:['published','Опубликована'],rejected:['rejected','Отклонена']}[g.status];return`<span class="status ${m[0]}"><span class="sd"></span>${m[1]}</span>`}
function isNew(g){return g.publishedAt&&Date.now()-g.publishedAt<3*DAY}
function priceBadge(g){return g.price===0?'<span class="price-badge free">Бесплатно</span>':`<span class="price-badge">${fmt(g.price)} AC</span>`}
function cardHTML(g,i=0,preview=false){
return`<article class="game-card anim" style="--d:${Math.min(i,12)*45}ms" ${preview?'':`data-action="open-game" data-id="${g.id}" role="button" tabindex="0" aria-label="${esc(g.title)}"`}>
<div class="cover" style="${coverStyle(g)}"><span class="cover-shine"></span><span class="cover-emoji">${g.emoji}</span>${isNew(g)||preview?'<span class="new-badge">NEW</span>':''}${priceBadge(g)}</div>

<div class="card-meta"><span class="card-author">${I('user',13)} ${esc(g.authorNick)}</span><span class="tag">${esc(g.genre)}</span></div>

</div></article>`}
function feedHTML(events){

function renderOverlay(force){
const root=$id('overlay-root');
if(!ui.overlay){root.innerHTML='';root.dataset.okey='';return}
const o=ui.overlay;const key=o.type+':'+(o.id||o.editId||'');
if(!force&&root.dataset.okey===key&&['publish','saveview','bulkreject'].includes(o.type))return;
let html='',preserveScroll=0,prevAmount='';
if(o.type==='game'){const g=gameById(o.id);if(!g){ui.overlay=null;root.innerHTML='';root.dataset.okey='';return}preserveScroll=$id('drawer-body')?.scrollTop||0;html=drawerHTML(g)}
else if(o.type==='publish')html=publishHTML();
else if(o.type==='topup'){prevAmount=$id('topup-amount')?.value||'';html=topupHTML()}
else if(o.type==='saveview')html=saveviewHTML();
else if(o.type==='bulkreject')html=bulkrejectHTML();
root.innerHTML=html;root.dataset.okey=key;
if(o.type==='game'&&preserveScroll){const b=$id('drawer-body');if(b)b.scrollTop=preserveScroll}
if(o.type==='topup'&&prevAmount){const a=$id('topup-amount');if(a)a.value=prevAmount}
if(o.type==='publish')updatePreview();
}
let overlayToken=0;

function doAuth(){
const nick=($id('a-nick')?.value||'').trim();const pass=$id('a-pass')?.value||'';
const err=$id('auth-err');const card=$id('auth-card');
const fail=m=>{if(err)err.textContent=m;card?.classList.add('shake');setTimeout(()=>card?.classList.remove('shake'),500);S.error()};
if(!nick||!pass)return fail('Заполните ник и пароль.');
if(ui.authTab==='login'){
const u=state.users.find(x=>x.nick.toLowerCase()===nick.toLowerCase());
if(!u||u.pass!==pass)return fail('Неверный ник или пароль.');
sessionId=u.id;ssSet(SESKEY,u.id);ui.view='catalog';sync();
if(u.role==='admin'){S.gold();burst(innerWidth/2,120,['#ffcf5c','#ff8a2a','#fff','#ff2e7e'],46);toast(`С возвращением, ${u.nick} 👑`,'gold')}

if(hasUnseen())setTimeout(()=>toast('Есть обновления статусов ваших игр — загляните в «Мои игры»','info'),700)}
}else{
if(!/^[A-Za-zА-Яа-яЁё0-9_-]{3,16}$/.test(nick))return fail('Ник: 3–16 символов, буквы/цифры/_/- без пробелов.');
const reserved=['arsart','admin','elex','moderator','support','root'];
if(reserved.includes(nick.toLowerCase()))return fail('Этот ник недоступен.');
if(state.users.some(x=>x.nick.toLowerCase()===nick.toLowerCase()))return fail('Этот ник уже занят.');
if(pass.length<4)return fail('Пароль — минимум 4 символа.');
if(pass!==($id('a-pass2')?.value||''))return fail('Пароли не совпадают.');
const u={id:uid('u'),nick,pass,role:'user',balance:500,hue:Math.floor(Math.random()*360),joined:Date.now(),unlimited:false,seen:{},views:[],events:[]};
pushEvent(u.events,'system','Аккаунт создан. Бонус за регистрацию: +500 AC 🎁');
state.users.push(u);sessionId=u.id;ssSet(SESKEY,u.id);adminEvent('user',`Новый игрок: ${nick}`);
ui.view='catalog';sync();S.gold();burst(innerWidth/2,140,['#a3ff3f','#22d3ee','#ffcf5c'],34);
toast('Аккаунт создан! Бонус +500 AC 🎁','success')}}

const u=me();if(!u)return;
const title=($id('p-title')?.value||'').trim();
const genre=$id('p-genre')?.value||GENRES[0];
const version=($id('p-version')?.value||'').trim()||'1.0.0';
const desc=($id('p-desc')?.value||'').trim();
let link=($id('p-link')?.value||'').trim();
const price=ui.pub.mode==='paid'?parseInt($id('p-price')?.value)||0:0;
const err=$id('pub-err');
const fail=(m,fid)=>{if(err)err.textContent=m;if(fid)$id(fid)?.classList.add('invalid');S.error()};
if(title.length<2)return fail('Название — минимум 2 символа.','p-title');
if(desc.length<10)return fail('Описание — минимум 10 символов. Расскажите об игре.','p-desc');
if(ui.pub.mode==='paid'&&price<1)return fail('Укажите цену от 1 AC или выберите «Бесплатно».','p-price');
if(!link)return fail('Приложите ссылку на файлы игры — по ней откроется кнопка «Скачать».','p-link');
if(!/^https?:\/\//i.test(link))link='https://'+link;
try{const uu=new URL(link);if(!/^https?:$/.test(uu.protocol)||!uu.hostname.includes('.'))throw 0;link=uu.href}catch(e){return fail('Ссылка выглядит некорректно. Пример: https://disk.yandex.ru/d/…','p-link')}
const ed=ui.overlay&&ui.overlay.editId?gameById(ui.overlay.editId):null;
if(ed){
if(!(ed.authorId===u.id||isAdmin()))return;
Object.assign(ed,{title,genre,version,desc,link,price,emoji:ui.pub.emoji,theme:ui.pub.theme});
if(ed.status==='rejected'){ed.status='pending';ed.createdAt=Date.now();ed.rejectReason='';adminEvent('submission',`Повторная заявка: «${title}» от ${u.nick}`);authorEvent(u.id,'submission',`Заявка «${title}» отправлена повторно`);toast('Исправленная заявка снова на проверке','success')}
else if(ed.status==='published')toast('Изменения сохранены и уже в каталоге','success');
else toast('Заявка обновлена','success');
S.success();
}else{
const g={id:uid('g'),title,genre,version,desc,link,price,emoji:ui.pub.emoji,theme:ui.pub.theme,
authorId:u.id,authorNick:u.nick,downloads:0,likes:[],rejectReason:'',
createdAt:Date.now(),publishedAt:null,myOrder:myGames().length,status:'pending'};
if(isAdmin()){g.status='published';g.publishedAt=Date.now();adminEvent('publish',`Опубликована «${title}» (${u.nick})`);authorEvent(u.id,'publish',`Ваша игра «${title}» опубликована ✅`);
toast('Опубликовано сразу ✅','gold');S.gold();burst(innerWidth/2,150,['#ffcf5c','#ff8a2a','#a3ff3f'],40)}
else{adminEvent('submission',`Новая заявка: «${title}» от ${u.nick}`);authorEvent(u.id,'submission',`Заявка «${title}» отправлена на проверку`);
toast('Заявка отправлена на проверку. После одобрения игра появится в каталоге','success');S.notify()}
state.games.push(g);
}
closeOverlay();ui.view='my';sync()}
function doDownload(g,e){
if(g.status!=='published'||!owns(g))return;
g.downloads++;sync();
const num=$id('dl-num');if(num)num.classList.add('pop');
S.download();burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2,['#22d3ee','#7c3aff','#fff'],18);
let w=null;try{w=window.open(g.link,'_blank','noopener')}catch(err){}
if(w)toast(`Скачивание началось · открыт ${hostLabel(g.link)}`,'success');
else toast('Браузер заблокировал новую вкладку','warn',{action:{label:'Открыть ссылку',fn:()=>window.open(g.link,'_blank','noopener')}})}
function doBuy(g,e){
const u=me();if(!u||g.status!=='published')return;
if(!u.unlimited&&u.balance<g.price){S.error();
document.querySelectorAll('.bal-pill').forEach(b=>{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500)});
toast('Недостаточно AC. Продавайте свои игры, чтобы заработать','error');return}
if(!u.unlimited)u.balance-=g.price;
const seller=userById(g.authorId);if(seller&&!seller.unlimited)seller.balance+=g.price;
state.purchases.push({id:uid('p'),userId:u.id,gameId:g.id,sellerId:g.authorId,price:g.price,title:g.title,ts:Date.now()});
authorEvent(u.id,'buy',`Покупка: «${g.title}» за ${fmt(g.price)} AC`);
authorEvent(g.authorId,'buy',`Ваша игра «${g.title}» куплена · +${fmt(g.price)} AC`);
adminEvent('buy',`${u.nick} купил «${g.title}» · +${fmt(g.price)} AC`);
sync();S.coin();burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2,['#ffcf5c','#ff8a2a','#fff'],30);
toast(u.unlimited?`Куплено по безлимиту ∞: «${g.title}»`:`Куплено: «${g.title}» за ${fmt(g.price)} AC`,'gold')}
function doDelete(g){
const u=me();if(!u||!(g.authorId===u.id||isAdmin()))return;
const idx=state.games.indexOf(g);state.games.splice(idx,1);ui.sel.delete(g.id);
if(g.authorId!==u.id)authorEvent(g.authorId,'reject',`Игра «${g.title}» снята с публикации`);
adminEvent('reject',`Удалена игра «${g.title}» (${g.authorNick})`);
if(ui.overlay&&ui.overlay.type==='game'&&ui.overlay.id===g.id)closeOverlay();
S.pop();sync();
let restored=false;
toast(`Игра «${g.title}» удалена`,'warn',{dur:8000,action:{label:'Отменить',fn:()=>{
if(restored||gameById(g.id))return;restored=true;
state.games.splice(Math.min(idx,state.games.length),0,g);sync();S.success();toast('Игра восстановлена','success')}}})}
function doTopupQuick(amt,e){
const u=me();if(!u||u.role!=='admin')return;
if(u.unlimited){toast('У вас уже включён безлимит ∞','info');return}
u.balance+=amt;adminEvent('topup',`Пополнение баланса: +${fmt(amt)} AC`);sync();
S.coin();burst(e.clientX||innerWidth/2,e.clientY||120,['#ffcf5c','#ff8a2a','#fff'],22);
toast(`+${fmt(amt)} AC зачислено`,'gold')}
function doTopupApply(){
const u=me();if(!u||u.role!=='admin')return;
const amt=parseInt($id('topup-amount')?.value);
if(!(amt>0)){$id('topup-err').textContent='Введите сумму больше нуля.';S.error();return}
if(amt>1e12){$id('topup-err').textContent='Максимум за раз: 1 000 000 000 000 AC. Или включите ∞.';S.error();return}
u.unlimited=false;u.balance+=amt;adminEvent('topup',`Пополнение баланса: +${fmt(amt)} AC`);
closeOverlay();sync();S.coin();burst(innerWidth/2,140,['#ffcf5c','#ff8a2a','#fff'],30);
toast(`+${fmt(amt)} AC зачислено`,'gold')}
function doUnlimited(){
const u=me();if(!u||u.role!=='admin')return;
u.unlimited=!u.unlimited;
adminEvent('topup',u.unlimited?'Включён безлимитный баланс ∞':'Безлимит выключен');
sync();
if(u.unlimited){S.gold();burst(innerWidth/2,140,['#ffcf5c','#ff2e7e','#fff','#a3ff3f'],44);toast('Безлимитный режим включён: баланс ∞','gold')}
else{S.pop();toast('Безлимит выключен','info')}}
function doSaveView(){
const u=me();if(!u)return;
const name=($id('view-name')?.value||'').trim()||'Мой вид';
if((u.views||[]).length>=8){$id('saveview-err').textContent='Максимум 8 сохранённых видов — удалите лишние.';S.error();return}
u.views.push({name,q:ui.q,genre:ui.genre,sort:ui.sort,free:ui.free});
closeOverlay();sync();S.success();toast(`Вид «${name}» сохранён`,'success')}
function doBulkReject(){
const reason=($id('bulk-reason')?.value||'').trim()||'Нарушение правил платформы';
const ids=[...ui.sel];let n=0;
ids.forEach(id=>{const g=gameById(id);if(g&&g.status==='pending'){rejectGame(g,reason);n++}});
ui.sel.clear();closeOverlay();sync();S.error();toast(`Отклонено заявок: ${n}`,'warn')}
function performReorder(dragId,target){
const list=myGames();const from=list.findIndex(g=>g.id===dragId);if(from<0)return;
const item=list.splice(from,1)[0];
let to=list.findIndex(g=>g.id===target.id);if(to<0){list.splice(from,0,item)}else{list.splice(to+(target.before?0:1),0,item)}
list.forEach((g,i)=>g.myOrder=i)}

/* ================= СОБЫТИЯ ================= */
function onClick(e){
const el=e.target.closest('[data-action]');if(!el)return;
const a=el.dataset.action;const id=el.dataset.id;const g=id?gameById(id):null;
switch(a){
case'nav':{let v=el.dataset.view;if(v==='mod'&&!isAdmin())v='catalog';if(!me())ui.view='auth';else ui.view=v;
ui.sel.clear();ui.reasonFor=null;if(ui.overlay)closeOverlay();window.scrollTo(0,0);sync();S.click();break}
case'sound-toggle':muted=!muted;ssSet(SNDKEY,muted?'1':'0');renderTopbar();renderTabbar();if(!muted)S.click();toast(muted?'Звук выключен':'Звук включён','info');break;
case'bal-click':if(isAdmin())openOverlay({type:'topup'});else{ui.view='profile';sync()}S.click();break;
case'open-publish':if(!me())return;ui.pub={emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],theme:Math.floor(Math.random()*THEMES.length),mode:'free'};openOverlay({type:'publish'});break;
case'open-game':if(g){ui.reasonFor=null;openOverlay({type:'game',id})}break;
case'close-overlay':closeOverlay();S.click();break;
case'auth-tab':ui.authTab=el.dataset.tab;renderMain();S.click();break;
case'toggle-pass':{const inp=$id(el.dataset.target);if(inp){const show=inp.type==='password';inp.type=show?'text':'password';el.innerHTML=I(show?'eyeoff':'eye',17)}break}
case'genre':ui.genre=el.dataset.g;ui.activeView=null;sync();S.click();break;
case'free-toggle':ui.free=!ui.free;ui.activeView=null;sync();S.click();break;
case'clear-filters':ui.q='';ui.genre='Все';ui.sort='popular';ui.free=false;ui.activeView=null;sync();S.click();break;
case'search-clear':{ui.q='';const s=$id('search');if(s){s.value='';s.focus()}$id('search-clear')?.classList.add('hidden');updateGrid();break}
case'scroll-grid':$id('grid-top')?.scrollIntoView({behavior:RM?'auto':'smooth'});S.click();break;
case'save-view-open':openOverlay({type:'saveview'});break;
case'apply-view':{const u=me();const v=u?.views?.[+el.dataset.i];if(v){ui.q=v.q;ui.genre=v.genre;ui.sort=v.sort;ui.free=v.free;ui.activeView=+el.dataset.i;sync();S.click()}break}
case'del-view':{e.stopPropagation();const u=me();if(u){u.views.splice(+el.dataset.i,1);ui.activeView=null;sync();S.pop()}break}
case'price-mode':ui.pub.mode=el.dataset.m;document.querySelectorAll('#publish-form .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.m===ui.pub.mode));$id('price-wrap')?.classList.toggle('hidden',ui.pub.mode==='free');updatePreview();S.click();break;
case'emoji-pick':ui.pub.emoji=el.dataset.v;document.querySelectorAll('.emoji-opt').forEach(b=>b.classList.toggle('active',b.dataset.v===ui.pub.emoji));updatePreview();S.pop();break;
case'theme-pick':ui.pub.theme=+el.dataset.i;document.querySelectorAll('.theme-sw').forEach(b=>b.classList.toggle('active',+b.dataset.i===ui.pub.theme));updatePreview();S.pop();break;
case'like':{if(!g||!me())break;const u=me();const i=g.likes.indexOf(u.id);
if(i>=0)g.likes.splice(i,1);else{g.likes.push(u.id);S.like();burst(e.clientX,e.clientY,['#ff2e7e','#ff8ae2'],10)}
sync();break}
case'download':if(g)doDownload(g,e);break;
case'buy':if(g)doBuy(g,e);break;
case'edit-game':{if(!g||!me())break;if(!(g.authorId===me().id||isAdmin()))break;
ui.pub={emoji:g.emoji,theme:g.theme,mode:g.price>0?'paid':'free'};openOverlay({type:'publish',editId:g.id});break}
case'delete-game':if(g)doDelete(g);break;
case'approve':{if(!g||!isAdmin())break;approveGame(g);sync();S.success();
burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2,['#2fe6a7','#a3ff3f','#ffcf5c'],26);
toast(`«${g.title}» опубликована ✅ Автор видит статус в «Мои игры»`,'success');break}
case'reject-toggle':ui.reasonFor=ui.reasonFor===id?null:id;sync();S.click();break;
case'reject-confirm':{if(!g||!isAdmin())break;const scope=el.dataset.scope||'q';
const reason=($id(`reason-${scope}-${id}`)?.value||'').trim()||'Нарушение правил платформы';
rejectGame(g,reason);ui.reasonFor=null;sync();S.error();toast(`Заявка «${g.title}» отклонена`,'warn');break}
case'bulk-approve':{if(!isAdmin())break;let n=0;[...ui.sel].forEach(sid=>{const gg=gameById(sid);if(gg&&gg.status==='pending'){approveGame(gg);n++}});
ui.sel.clear();sync();S.success();burst(innerWidth/2,innerHeight/2,['#2fe6a7','#a3ff3f','#ffcf5c'],40);toast(`Опубликовано игр: ${n} ✅`,'success');break}
case'bulk-reject-open':if(isAdmin()&&ui.sel.size)openOverlay({type:'bulkreject'});break;
case'sel-clear':ui.sel.clear();document.querySelectorAll('.q-check').forEach(c=>c.checked=false);updateBulkUI();S.click();break;
case'open-link':{const link=el.dataset.link;if(link){try{window.open(link,'_blank','noopener')}catch(err){}S.click()}break}
case'topup-open':if(isAdmin())openOverlay({type:'topup'});break;
case'topup-quick':doTopupQuick(+el.dataset.amt,e);break;
case'unlimited-toggle':doUnlimited();break;
case'reorder':{if(!g)break;const list=myGames();const i=list.findIndex(x=>x.id===g.id);const j=i+ +el.dataset.dir;
if(j>=0&&j<list.length){const t=list[i].myOrder;list[i].myOrder=list[j].myOrder;list[j].myOrder=t;sync();S.pop()}break}
case'logout':sessionId=null;ssDel(SESKEY);ui.view='auth';ui.overlay=null;ui.sel.clear();sync();toast('Вы вышли из аккаунта','info');S.click();break;
}}
function onChange(e){
const t=e.target;
if(t.id==='sort'){ui.sort=t.value;ui.activeView=null;updateGrid();S.click()}
else if(t.classList.contains('q-check')){t.checked?ui.sel.add(t.dataset.id):ui.sel.delete(t.dataset.id);updateBulkUI();S.pop()}
else if(t.id==='sel-all'){const ids=pendingGames().map(g=>g.id);if(t.checked)ids.forEach(i=>ui.sel.add(i));else ui.sel.clear();
document.querySelectorAll('.q-check').forEach(c=>c.checked=t.checked);updateBulkUI();S.click()}
else if(t.id==='p-genre')updatePreview()}
function onInput(e){
const t=e.target;
if(t.id==='search'){ui.q=t.value;ui.activeView=null;updateGrid();$id('search-clear')?.classList.toggle('hidden',!t.value)}
else if(t.closest&&t.closest('#publish-form')){t.classList.remove('invalid');const err=$id('pub-err');if(err)err.textContent='';
if(t.id==='p-desc'){const c=$id('desc-count');if(c)c.textContent=`${t.value.length}/600`}updatePreview()}}
function onSubmit(e){
e.preventDefault();const f=e.target;
if(f.id==='auth-form')doAuth();
else if(f.id==='publish-form')doPublish();
else if(f.id==='topup-form')doTopupApply();
else if(f.id==='saveview-form')doSaveView();
else if(f.id==='bulkreject-form')doBulkReject()}
function onKey(e){
if(e.key==='Escape'&&ui.overlay){closeOverlay();return}
if(e.key==='Enter'||e.key===' '){const el=e.target.closest&&e.target.closest('[data-action][role="button"]');
if(el){e.preventDefault();el.click()}}}
function clearDropCls(){document.querySelectorAll('.my-row').forEach(r=>r.classList.remove('drop-before','drop-after','dragging'))}
function onDragStart(e){const r=e.target.closest&&e.target.closest('.my-row');if(!r)return;
ui.dragId=r.dataset.myid;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',ui.dragId)}catch(err){}
requestAnimationFrame(()=>r.classList.add('dragging'))}
function onDragOver(e){const r=e.target.closest&&e.target.closest('.my-row');if(!r||!ui.dragId)return;
e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(err){}
const rect=r.getBoundingClientRect();const before=(e.clientY-rect.top)<rect.height/2;
document.querySelectorAll('.my-row').forEach(x=>{if(x!==r)x.classList.remove('drop-before','drop-after')});
r.classList.toggle('drop-before',before);r.classList.toggle('drop-after',!before);
ui.dropTarget={id:r.dataset.myid,before}}
function onDrop(e){if(!ui.dragId||!ui.dropTarget)return;e.preventDefault();
if(ui.dragId!==ui.dropTarget.id){performReorder(ui.dragId,ui.dropTarget);sync();S.pop()}
ui.dragId=null;ui.dropTarget=null;clearDropCls()}
function onDragEnd(){ui.dragId=null;ui.dropTarget=null;clearDropCls()}
/* Защита от выделения / копирования / контекстного меню (кроме полей ввода) */
const editable=t=>t&&t.closest&&t.closest('input,textarea,[contenteditable="true"]');
document.addEventListener('selectstart',e=>{if(!editable(e.target))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(!editable(e.target))e.preventDefault()});
document.addEventListener('copy',e=>{if(!editable(e.target))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(!(e.target.closest&&e.target.closest('[draggable="true"]')))e.preventDefault()});

/* ================= СИНХРОНИЗАЦИЯ МЕЖДУ ВКЛАДКАМИ / АККАУНТАМИ ================= */
window.addEventListener('storage',e=>{
if(e.key!==SKEY)return;
let next=null;
if(e.newValue){try{next=JSON.parse(e.newValue)}catch(err){return}
if(!next||next.v!==1||!Array.isArray(next.users)||!Array.isArray(next.games))return}
else next=seed();
const myId=sessionId;
let beforeStatuses=null;
if(myId){beforeStatuses={};state.games.forEach(g=>{if(g.authorId===myId)beforeStatuses[g.id]=g.status})}
const wasAdmin=isAdmin();const pendBefore=wasAdmin?pendingGames().length:0;
state=next;
if(myId&&!userById(myId)){sessionId=null;ssDel(SESKEY);ui.view='auth'}
renderAll();
if(myId&&beforeStatuses){for(const g of state.games){
if(g.authorId===myId&&beforeStatuses[g.id]&&beforeStatuses[g.id]!==g.status){
toast(g.status==='published'?`«${g.title}»: игра опубликована ✅`:`«${g.title}»: статус заявки обновился`,g.status==='published'?'success':'warn');
S.notify();break}}}
if(isAdmin()&&pendingGames().length>pendBefore){toast('Новая заявка на проверку','info');S.notify()}
});

/* ================= ИНИЦИАЛИЗАЦИЯ ================= */
state=load();
if(sessionId&&!userById(sessionId)){sessionId=null;ssDel(SESKEY)}
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);
document.addEventListener('submit',onSubmit);
document.addEventListener('keydown',onKey);
document.addEventListener('dragstart',onDragStart);
document.addEventListener('dragover',onDragOver);
document.addEventListener('drop',onDrop);
document.addEventListener('dragend',onDragEnd);
document.addEventListener('pointerdown',()=>audio(),{once:true});
window.addEventListener('resize',fxResize);
fxResize();
requestAnimationFrame(fxLoop);
if(me())ui.view='catalog';else ui.view='auth';
renderAll();
save();
</script>
</body>
</html>
